name: Parkeerwacht
version: "0.2.1"
slug: parkeerwacht
description: Ziet via de camera of er voor de deur plek is om te parkeren en te laden
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: http://[HOST]:[PORT:8099]/health
homeassistant_api: true
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
panel_title: Parkeerwacht
options:
  camera_entity: camera.tapo_woning_voor_live_view
  core_url: http://homeassistant:8123
  interval_seconds: 60
  min_confidence: 0.35
  tile_size_m: 0.3
  zone_start_m: 2.2
  zone_end_m: 12.1
  min_free_m: 4.5
  confirm_occupied: 2
  confirm_free: 3
schema:
  camera_entity: str
  core_url: url
  interval_seconds: int(15,600)
  min_confidence: float(0.1,0.95)
  tile_size_m: float(0.1,1)
  zone_start_m: float(0,30)
  zone_end_m: float(0,30)
  min_free_m: float(1,15)
  confirm_occupied: int(1,10)
  confirm_free: int(1,10)
