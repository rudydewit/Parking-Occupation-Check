<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parkeerwacht</title>
<style>
  :root { --bg:#f5f5f5; --card:#fff; --text:#1c1c1c; --muted:#666; --free:#1b8a4b; --busy:#c8362b; --unknown:#777; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1d1d1d; --text:#eee; --muted:#aaa; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,sans-serif; }
  main { max-width:900px; margin:auto; display:grid; gap:16px; }
  section { background:var(--card); border-radius:12px; padding:16px; }
  h1 { margin:0; font-size:1.6rem; }
  h2 { margin:0 0 10px; font-size:1.1rem; }
  #status { color:#fff; background:var(--unknown); }
  #status.free { background:var(--free); }
  #status.busy { background:var(--busy); }
  #status p { margin:4px 0 0; }
  .frame { line-height:0; }
  .frame img { width:100%; border-radius:8px; background:#333; min-height:120px; }
  .hint, .muted { color:var(--muted); font-size:.9rem; }
  #history { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  #history a { color:inherit; text-decoration:none; font-size:.85rem; }
  #history img { width:100%; border-radius:6px; display:block; margin-bottom:3px; }
</style>
</head>
<body>
<main>
  <section id="status" aria-live="polite">
    <h1 id="title">Even kijken…</h1>
    <p id="detail"></p>
  </section>
  <section>
    <h2>Camerabeeld</h2>
    <div class="frame">
      <img id="photo" alt="Laatste camerabeeld met de laadzone langs de stoeprand">
    </div>
    <p class="hint">Rode lijn: laadzone langs de stoeprand. Groene lijn: grootste vrije stuk daarin.</p>
    <p class="muted" id="last"></p>
  </section>
  <section>
    <h2>Laatste wisselingen</h2>
    <div id="history"></div>
    <p class="muted" id="empty">Nog geen wisselingen gezien.</p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let stamp = 0;

function time(epoch) {
  return new Date(epoch * 1000).toLocaleString("nl-NL", { weekday:"short", hour:"2-digit", minute:"2-digit" });
}

function metres(value) {
  return value.toLocaleString("nl-NL", { minimumFractionDigits:1, maximumFractionDigits:1 }) + " m";
}

async function refresh() {
  const response = await fetch("api/state");
  const state = await response.json();
  const box = $("status");
  box.classList.toggle("free", state.occupied === false);
  box.classList.toggle("busy", state.occupied === true);
  $("title").textContent = state.occupied === false ? "Vrij: laden mogelijk"
    : state.occupied === true ? "Bezet" : "Status onbekend";
  $("detail").textContent = state.error ? state.error
    : state.last_check ? "Grootste vrije stuk: " + metres(state.free) + " (nodig: " + metres(state.min_free) + ")" : "Wacht op het eerste camerabeeld";
  $("last").textContent = state.last_check ? "Laatste controle: " + time(state.last_check) : "";
  if (state.last_check !== stamp) { stamp = state.last_check; $("photo").src = "api/annotated.jpg?t=" + stamp; }
  $("empty").hidden = state.history.length > 0;
  const list = $("history");
  list.replaceChildren(...state.history.map(item => {
    const link = document.createElement("a");
    link.href = "api/history/" + item.id + ".jpg";
    link.target = "_blank";
    const image = document.createElement("img");
    image.src = link.getAttribute("href");
    image.alt = item.occupied ? "Foto: plek werd bezet" : "Foto: plek werd vrij";
    image.loading = "lazy";
    link.append(image, (item.occupied ? "Bezet, " : "Vrij, ") + time(item.id));
    return link;
  }));
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
